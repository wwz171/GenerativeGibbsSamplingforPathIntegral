name: ggpi
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - numpy
  - matplotlib
  - tqdm
  - numba
  - freud-analysis
  - jupyter
  - ipykernel
  - pip
  - pip:
    - -e .
# NOTE: PyTorch and PyTorch Geometric must be installed separately!
# After activating this environment, run:
#   pip install torch --index-url https://download.pytorch.org/whl/cu121
#   pip install torch-geometric torch-scatter torch-sparse torch-cluster
  
